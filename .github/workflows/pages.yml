name: 사이트 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html version.json patches.json manifest.webmanifest sw.js og.png icon-*.png destroy* .nojekyll ui sprites sprites_cut _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
